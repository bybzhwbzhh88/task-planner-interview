<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">任务规划工具额度处理产品界面示意</title>
  <desc id="desc">展示可用额度、生成日程、成功扣减提示和日程结果。此图为产品方案示意，不是运行截图。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172554" flood-opacity=".12"/></filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17233d; }
      .muted { fill: #66758c; }
      .tiny { font-size: 14px; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .heading { font-size: 24px; font-weight: 700; }
      .onblue { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="790" fill="#f3f6fb"/>
  <text x="80" y="44" font-size="18" font-weight="700" fill="#334155">产品界面示意</text>
  <rect x="214" y="19" width="124" height="34" rx="17" fill="#fff0d9"/>
  <text x="230" y="41" font-size="14" font-weight="700" fill="#9a5700">非运行截图</text>
  <text x="850" y="41" font-size="14" class="muted">对应 PRODUCT_SPEC.md 第 3 节</text>

  <rect x="80" y="70" width="1040" height="665" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M100 70h1000a20 20 0 0 1 20 20v34H80V90a20 20 0 0 1 20-20z" fill="#e9eef6"/>
  <circle cx="112" cy="97" r="6" fill="#ff7676"/><circle cx="134" cy="97" r="6" fill="#ffbd56"/><circle cx="156" cy="97" r="6" fill="#64c88a"/>
  <rect x="400" y="82" width="400" height="29" rx="14" fill="#ffffff"/>
  <text x="495" y="102" font-size="13" class="muted">任务规划工具 · 产品方案预览</text>

  <text x="126" y="176" font-size="32" font-weight="800">AI 任务规划</text>
  <text x="126" y="207" class="small muted">输入待办事项和可用时长，生成一份模拟日程</text>

  <rect x="126" y="235" width="526" height="456" rx="16" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
  <text x="152" y="275" class="heading">今日待办</text>
  <rect x="152" y="295" width="354" height="46" rx="9" fill="#f9fbfe" stroke="#cbd5e1"/>
  <text x="167" y="325" class="small muted">输入待办事项</text>
  <rect x="518" y="295" width="108" height="46" rx="9" fill="#dce8fa"/>
  <text x="540" y="325" class="small" font-weight="700">添加任务</text>

  <rect x="152" y="363" width="474" height="62" rx="10" fill="#f9fbfe" stroke="#e1e8f2"/>
  <rect x="169" y="384" width="20" height="20" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="203" y="403" class="body">整理项目周报</text>
  <text x="555" y="403" class="small muted">2 小时</text>
  <rect x="152" y="435" width="474" height="62" rx="10" fill="#f9fbfe" stroke="#e1e8f2"/>
  <rect x="169" y="456" width="20" height="20" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="203" y="475" class="body">准备明日会议</text>
  <text x="555" y="475" class="small muted">1 小时</text>

  <text x="152" y="543" class="small muted">今天可用的工作时长</text>
  <rect x="535" y="516" width="91" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="553" y="543" class="small">8 小时</text>
  <rect x="152" y="578" width="181" height="32" rx="16" fill="#e7f5ed"/>
  <circle cx="172" cy="594" r="5" fill="#2a9d61"/>
  <text x="187" y="600" font-size="15" font-weight="700" fill="#176843">可用额度：2</text>
  <text x="348" y="600" font-size="14" class="muted">每成功生成一次消耗 1 个</text>
  <rect x="152" y="627" width="474" height="46" rx="9" fill="#315fe8"/>
  <text x="323" y="658" font-size="18" font-weight="700" class="onblue">生成日程</text>

  <rect x="676" y="235" width="398" height="456" rx="16" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
  <rect x="700" y="259" width="350" height="80" rx="12" fill="#e8f7ee"/>
  <circle cx="729" cy="292" r="13" fill="#2da865"/>
  <path d="m723 292 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="751" y="291" font-size="17" font-weight="700" fill="#176843">日程已生成</text>
  <text x="751" y="318" font-size="14" fill="#287953">消耗 1 个额度，当前可用 2 个</text>
  <text x="700" y="383" class="heading">本次日程</text>
  <rect x="700" y="403" width="350" height="103" rx="10" fill="#f5f8fe" stroke="#dfe8f7"/>
  <circle cx="721" cy="433" r="5" fill="#315fe8"/>
  <text x="737" y="439" class="body" font-weight="700">整理项目周报</text>
  <text x="737" y="469" class="small muted">准备 · 执行 · 复盘</text>
  <text x="980" y="470" class="tiny muted">2 小时</text>
  <rect x="700" y="519" width="350" height="103" rx="10" fill="#f5f8fe" stroke="#dfe8f7"/>
  <circle cx="721" cy="549" r="5" fill="#315fe8"/>
  <text x="737" y="555" class="body" font-weight="700">准备明日会议</text>
  <text x="737" y="585" class="small muted">准备 · 执行 · 复盘</text>
  <text x="980" y="586" class="tiny muted">1 小时</text>
  <text x="700" y="657" font-size="14" class="muted">失败时展示“本次未扣额度，可重试”；额度为 0 时提示原因。</text>
</svg>
