<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日程生成额度 · 产品交互原型</title>
  <style>
    :root{color-scheme:light;--bg:#f5f5f2;--ink:#202b29;--muted:#59655f;--line:#dce1dc;--green:#24654b;--soft:#eaf2ed;--warn:#835815;--error:#9b3931}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    main{max-width:1160px;margin:auto;padding:32px 28px 60px}h1{font-size:29px;line-height:1.3;margin:8px 0 12px;font-weight:650;letter-spacing:-.8px}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0 0 6px}p{margin:7px 0}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);font-weight:650}.intro{max-width:720px;color:var(--muted)}.tag{font-size:12px;padding:4px 9px;background:var(--soft);color:var(--green);border-radius:5px}.topline,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    button,select,input,textarea{font:inherit}button,select{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 12px}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--green);background:var(--soft)}button:disabled{cursor:not-allowed;opacity:.55}button.primary{background:var(--green);border-color:var(--green);color:white}button.primary:hover:not(:disabled){background:#194f39}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8ab7e7;outline-offset:3px}label{display:block;font-size:13px;font-weight:600}input,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:10px;background:white;color:var(--ink)}textarea{min-height:94px;resize:vertical;line-height:1.6}input[type=number]{width:90px;text-align:center}
    .controls{margin:26px 0 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}.controlbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.controlbar label{flex:1;min-width:210px}.controlbar select{display:block;width:100%;margin-top:5px}.caption{color:var(--muted);font-size:12px}.live-facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:13px;font-size:13px}.live-facts strong{font-size:16px;font-variant-numeric:tabular-nums}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.window{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.window-head{padding:13px 20px;background:#f9faf8;border-bottom:1px solid var(--line)}.window-content{padding:22px}.window h2{margin-bottom:6px}.quota{margin:18px 0;background:var(--soft);padding:12px 14px;border-radius:7px}.quota strong{color:var(--green);font-variant-numeric:tabular-nums}.quota p{font-size:12px;color:var(--muted);margin:4px 0 0}.formrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0}.generate{width:100%;margin-top:4px}.notice{border-left:3px solid var(--line);padding:9px 12px;background:#f8f9f7;margin:14px 0;font-size:13px;overflow-wrap:anywhere}.notice[data-tone=success]{border-color:var(--green);background:#eff6f1}.notice[data-tone=error]{border-color:var(--error);background:#fbf1ef}.notice[data-tone=warning]{border-color:var(--warn);background:#fbf5e8}.notice p{margin:3px 0}.links{display:flex;gap:10px;flex-wrap:wrap}.links button{font-size:13px}.result{border-top:1px solid var(--line);padding-top:15px;margin-top:18px}.result p{font-size:13px}.result ol{font-size:13px;padding-left:20px}.empty{color:var(--muted);font-size:13px}.history{margin-top:12px}.history button{display:block;width:100%;text-align:left;margin:8px 0;font-size:13px}.history button span{display:block;font-size:12px;color:var(--muted)}.audit{margin-top:24px;border-top:1px solid var(--line);padding-top:15px}.audit summary{cursor:pointer;color:var(--muted);font-size:13px}.audit pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,Consolas,monospace;background:#eef0ec;border-radius:7px;padding:14px;max-height:230px;overflow:auto}.foot{font-size:12px;color:var(--muted);margin-top:22px}.foot a{color:var(--green)}[hidden]{display:none!important}
    @media(max-width:820px){.workspace{grid-template-columns:1fr}main{padding:22px 18px 40px}.window-content{padding:18px}.controlbar label{flex-basis:100%}.controlbar button{flex:1;white-space:nowrap}.topline{align-items:flex-start}}@media(max-width:380px){main{padding:18px 12px 32px}h1{font-size:25px}.live-facts{gap:12px}.window-content{padding:15px}.controlbar button{flex-basis:100%}.tag{max-width:100%}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="topline"><span class="eyebrow">Task planner / Product study</span><span class="tag">产品原型 · 本地模拟</span></div>
    <h1>每一次生成，都有明白的交代。</h1>
    <p class="intro">先知道还有几次机会，再放心生成。下方两个窗口属于同一账号，试试只剩 1 次时一起生成，会发生什么。</p>
  </header>
  <section class="controls" aria-label="评审演示控制，不属于正式产品页面">
    <div class="controlbar">
      <label for="scenario">评审场景（切换会重置演示）
        <select id="scenario">
          <option value="normal">正常生成 · 剩余 3 次</option>
          <option value="last">两个窗口争最后 1 次</option>
          <option value="empty">额度已用完 · 0 次</option>
          <option value="failure">模型明确失败 · 任务含 [fail]</option>
          <option value="save">结果保存失败 · 剩余 1 次</option>
          <option value="lost">浏览器响应丢失 · 后台实际成功</option>
        </select>
      </label>
      <button type="button" id="concurrent" class="primary">两窗同时请求</button>
      <button type="button" id="reset">重置场景</button>
    </div>
    <p class="caption">以上为评审控制。以下是用户页面；窗口会保留旧额度，用“刷新状态”模拟重新读取。演示延迟约 1.4 秒。</p>
    <div class="live-facts" id="facts" aria-live="polite"></div>
  </section>
  <div class="workspace" id="windows"></div>
  <details class="audit"><summary>查看原型事件：理解发生顺序（非真实后端证据）</summary><pre id="events"></pre></details>
  <p class="foot">本原型不连接模型或数据库，也不验证真实并发安全。流程与开发任务见 <a href="../PRODUCT.md">产品方案</a>；验收条件见 <a href="../ACCEPTANCE.md">验收文档</a>。</p>
</main>
<script src="model.js"></script>
<script>
(() => {
  const model = new QuotaPrototype.QuotaModel();
  const tabs = {};
  const presets = {
    normal: { credits: 3, outcome: 'success' },
    last: { credits: 1, outcome: 'success' },
    empty: { credits: 0, outcome: 'success' },
    failure: { credits: 1, outcome: 'success', fail: true },
    save: { credits: 1, outcome: 'save-failure' },
    lost: { credits: 1, outcome: 'response-lost' }
  };
  let epoch = 0;
  const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
  const byId = (id) => document.getElementById(id);

  function buildWindow(id) {
    return `<section class="window" aria-label="窗口 ${id}">
      <div class="window-head row"><strong>窗口 ${id}</strong><span class="caption">同一账号 · 日程规划</span></div>
      <div class="window-content">
        <h2>今天，想完成什么？</h2><p class="caption">输入任务与可用时长，生成一份模拟日程。</p>
        <div class="quota" id="quota-${id}"></div>
        <label for="tasks-${id}">待办事项 <span class="caption">每行一个任务（原型简化输入）</span></label>
        <textarea id="tasks-${id}" spellcheck="false"></textarea>
        <div class="formrow"><label for="hours-${id}">今天可用的工作时长</label><div><input type="number" id="hours-${id}" min="1" max="24" step="0.5" value="8" aria-label="窗口 ${id} 工作时长"> 小时</div></div>
        <button class="primary generate" id="generate-${id}" type="button">生成日程</button>
        <p class="caption">成功生成并保存后扣 1 次；明确失败不扣。</p>
        <div class="notice" id="notice-${id}" role="status" aria-live="polite"></div>
        <div class="links"><button type="button" id="refresh-${id}">刷新状态</button><button type="button" id="history-toggle-${id}" aria-expanded="false" aria-controls="history-${id}">查看已保存日程</button></div>
        <div class="history" id="history-${id}" hidden></div>
        <div class="result" id="result-${id}"><p class="empty">生成后，日程会显示在这里。</p></div>
      </div></section>`;
  }

  function monitor() {
    const state = model.snapshot();
    byId('facts').innerHTML = `<span>模拟后台可用 <strong>${state.available}</strong> 次</span><span>生成中 <strong>${state.reserved}</strong> 份</span><span>模拟模型调用 <strong>${state.calls}</strong> 次</span><span>已保存 <strong>${state.history.length}</strong> 份</span>`;
    byId('events').textContent = model.events.map((event) => JSON.stringify(event)).join('\n');
    byId('concurrent').disabled = state.reserved > 0;
  }

  function message(id, text, tone = '') {
    tabs[id].message = text;
    const el = byId(`notice-${id}`);
    el.textContent = text;
    el.dataset.tone = tone;
  }

  function render(id) {
    const tab = tabs[id], state = tab.view;
    byId(`quota-${id}`).innerHTML = `<strong>可用 ${state.available} 次</strong> · ${state.reserved} 份生成中<p>最近一次读取的账号状态</p>`;
    const button = byId(`generate-${id}`);
    const valid = byId(`tasks-${id}`).value.trim().length > 0 && byId(`hours-${id}`).checkValidity() && !!byId(`hours-${id}`).value;
    button.disabled = tab.pending || state.available === 0 || !valid;
    button.textContent = tab.pending ? '生成中…' : '生成日程';
    if (!tab.pending && !tab.message) {
      if (!valid) message(id, '请填写至少一个任务，并设置 1–24 小时的工作时长。');
      else if (state.available === 0) message(id, state.reserved
        ? '当前额度正在使用，请稍后刷新。'
        : '本账号额度已用完，仍可编辑任务或查看已保存日程。', 'warning');
      else message(id, '准备好了，成功生成并保存后才扣除额度。');
    }
    if (tab.historyOpen) renderHistory(id);
  }

  function showResult(id, result, fromHistory = false) {
    tabs[id].result = result;
    byId(`result-${id}`).innerHTML = `<h3>${fromHistory ? '已保存日程' : '本次日程'} · ${escape(result.id)}</h3><p class="caption">任务快照 · 可用 ${result.hours} 小时 · 来自窗口 ${escape(result.tab)}</p><ol>${result.tasks.map((task) => `<li>${escape(task)}<br><span class="caption">准备 → 执行 → 复盘</span></li>`).join('')}</ol>`;
  }

  function renderHistory(id) {
    const container = byId(`history-${id}`);
    container.hidden = !tabs[id].historyOpen;
    byId(`history-toggle-${id}`).setAttribute('aria-expanded', String(tabs[id].historyOpen));
    const history = tabs[id].view.history.slice(0, 5);
    container.innerHTML = history.length
      ? history.map((item) => `<button type="button" data-result="${escape(item.id)}">日程 ${escape(item.id)} · 窗口 ${escape(item.tab)}<span>${escape(item.tasks.join('、'))}</span></button>`).join('')
      : '<p class="empty">还没有已保存日程。查看历史不会消耗额度。</p>';
    container.querySelectorAll('[data-result]').forEach((button) => button.addEventListener('click', () => {
      const result = history.find((item) => item.id === button.dataset.result);
      if (result) showResult(id, result, true);
    }));
  }

  function refresh(id) {
    const tab = tabs[id];
    tab.view = model.snapshot();
    if (tab.unknown) {
      message(id, '已刷新额度和已保存日程。上次请求的结果仍未确认，请核对；再次生成是新任务，成功会再扣 1 次。', 'warning');
    } else if (!tab.pending) {
      tab.message = '';
      byId(`notice-${id}`).textContent = '';
    }
    render(id);
  }

  async function generate(id) {
    const tab = tabs[id], currentEpoch = epoch;
    if (tab.pending) return;
    const request = model.start({
      tab: id,
      tasks: byId(`tasks-${id}`).value.split('\n'),
      hours: Number(byId(`hours-${id}`).value),
      outcome: presets[byId('scenario').value].outcome
    });
    if (request.accepted) {
      tab.pending = true;
      tab.unknown = false;
      tab.view = model.snapshot();
      message(id, '正在生成，暂占 1 次额度。编辑任务只影响下次生成。');
      render(id);
    }
    const response = await request.done;
    if (currentEpoch !== epoch) return;
    tab.pending = false;
    if (response.status === 'unknown') {
      tab.unknown = true;
      message(id, '暂时无法确认生成结果。请刷新额度并查看已保存日程，再决定是否重新生成。', 'warning');
    } else {
      tab.view = model.snapshot();
      if (response.status === 'success') {
        showResult(id, response.result);
        message(id, tab.view.available === 0
          ? '已生成并保存，本次扣除 1 次。当前无可用额度，仍可编辑任务或查看已保存日程。'
          : '已生成并保存，本次扣除 1 次。', 'success');
      } else if (response.status === 'model-failure') {
        message(id, '生成失败，本次未扣额度。请重试；若任务含 [fail]，请先删除该标记或任务。', 'error');
      } else if (response.status === 'save-failure') {
        message(id, '日程未保存，本次未扣额度，请重试。', 'error');
      } else if (response.status === 'busy') {
        message(id, '当前额度正在使用，请稍后刷新。本次未发起生成，不会自动排队。', 'warning');
      } else if (response.status === 'exhausted') {
        message(id, '本账号额度已用完，仍可编辑任务或查看已保存日程。', 'warning');
      } else if (response.status === 'invalid') {
        message(id, '请填写至少一个任务，并设置 1–24 小时的工作时长。', 'error');
      }
    }
    render(id);
  }

  function reset() {
    epoch += 1;
    const preset = presets[byId('scenario').value];
    model.reset(preset.credits);
    byId('windows').innerHTML = ['A','B'].map(buildWindow).join('');
    for (const id of ['A','B']) {
      tabs[id] = { view: model.snapshot(), pending: false, message: '', historyOpen: false, unknown: false };
      byId(`tasks-${id}`).value = preset.fail ? '准备项目方案 [fail]' : '整理本周待办\n完成项目方案';
      byId(`generate-${id}`).addEventListener('click', () => generate(id));
      byId(`refresh-${id}`).addEventListener('click', () => refresh(id));
      byId(`history-toggle-${id}`).addEventListener('click', () => {
        tabs[id].view = model.snapshot();
        tabs[id].historyOpen = !tabs[id].historyOpen;
        renderHistory(id);
        render(id);
      });
      for (const field of ['tasks','hours']) byId(`${field}-${id}`).addEventListener('input', () => {
        if (!tabs[id].pending && !tabs[id].unknown) tabs[id].message = '';
        render(id);
      });
      render(id);
    }
    monitor();
  }

  model.subscribe(monitor);
  byId('scenario').addEventListener('change', reset);
  byId('reset').addEventListener('click', reset);
  byId('concurrent').addEventListener('click', () => { void Promise.all([generate('A'), generate('B')]); });
  reset();
  // Exposes read-only observations for browser smoke checks, never a real backend.
  window.quotaDemo = { snapshot: () => model.snapshot() };
})();
</script>
</body>
</html>
