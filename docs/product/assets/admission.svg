<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">生成准入流程</title><desc id="desc">用户提交后先判断登录与输入、账号并发和可用额度；接受后占用一次额度、记录输入，再调用模型。所有拒绝分支均不占用、不调用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b91a3"/></marker></defs><rect width="1100" height="840" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#24283b"><text x="40" y="42" font-size="25" font-weight="600">生成准入：先确认资格，再调用模型</text><rect x="380" y="75" width="340" height="58" rx="14" fill="#f2eeff" stroke="#c6b8ef"/><text x="550.0" y="111.0" text-anchor="middle">用户提交生成</text><rect x="380" y="180" width="340" height="72" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="550.0" y="223.0" text-anchor="middle">已登录且输入有效？</text><rect x="30" y="180" width="270" height="72" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="165.0" y="223.0" text-anchor="middle">提示登录或修正输入</text><rect x="380" y="300" width="340" height="72" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="550.0" y="343.0" text-anchor="middle">账号进行中少于 3 个？</text><rect x="800" y="300" width="270" height="72" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="935.0" y="343.0" text-anchor="middle">并发超限，不排队</text><rect x="380" y="420" width="340" height="72" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="550.0" y="463.0" text-anchor="middle">至少 1 次可用额度？</text><rect x="30" y="420" width="270" height="72" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="165.0" y="463.0" text-anchor="middle">说明额度占用或用尽</text><rect x="380" y="545" width="340" height="90" rx="14" fill="#f2eeff" stroke="#c6b8ef"/><text x="550.0" y="583.5" text-anchor="middle">一致确认资格并占用 1 次</text><text x="550.0" y="610.5" text-anchor="middle">记录提交时输入</text><rect x="380" y="685" width="340" height="65" rx="14" fill="#eef8f1" stroke="#b6d9c3"/><text x="550.0" y="724.5" text-anchor="middle">调用本地模拟模型</text><polyline points="550,133 550,180" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><polyline points="550,252 550,300" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="281.0" font-size="17" fill="#61687c">是</text><polyline points="550,372 550,420" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="401.0" font-size="17" fill="#61687c">是</text><polyline points="550,492 550,545" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="523.5" font-size="17" fill="#61687c">是</text><polyline points="550,635 550,685" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><polyline points="380,216 300,216" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="329" y="203" font-size="17" fill="#61687c">否</text><polyline points="720,336 800,336" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="323" font-size="17" fill="#61687c">否</text><polyline points="380,456 300,456" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="329" y="443" font-size="17" fill="#61687c">否</text><text x="40" y="807" font-size="17" fill="#61687c">拒绝分支：不占额度、不调用模型。资格判断与占用须防止并发插入。</text></g></svg>