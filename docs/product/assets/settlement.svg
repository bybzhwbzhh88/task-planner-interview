<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="855" viewBox="0 0 1100 855" role="img" aria-labelledby="title desc"><title id="title">生成结算与查询流程</title><desc id="desc">模型明确失败或保存明确失败释放本次占用。成功保存与结算后消耗一次。页面未收到结果时单独查询原请求，不重新生成或扣费。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b91a3"/></marker></defs><rect width="1100" height="855" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#24283b"><text x="40" y="42" font-size="25" font-weight="600">生成结算与页面查询：结果待确认不等于失败</text><rect x="380" y="80" width="340" height="60" rx="14" fill="#f2eeff" stroke="#c6b8ef"/><text x="550.0" y="117.0" text-anchor="middle">模型处理</text><rect x="380" y="195" width="340" height="72" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="550.0" y="238.0" text-anchor="middle">模型返回明确结果</text><rect x="25" y="195" width="280" height="90" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="165.0" y="233.5" text-anchor="middle">模型明确失败</text><text x="165.0" y="260.5" text-anchor="middle">释放本次占用及名额</text><rect x="380" y="330" width="340" height="85" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="550.0" y="379.5" text-anchor="middle">保存结果并一致结算</text><rect x="795" y="330" width="280" height="90" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="935.0" y="368.5" text-anchor="middle">保存明确失败</text><text x="935.0" y="395.5" text-anchor="middle">释放本次占用及名额</text><rect x="380" y="475" width="340" height="90" rx="14" fill="#eef8f1" stroke="#b6d9c3"/><text x="550.0" y="513.5" text-anchor="middle">生成成功，消耗 1 次</text><text x="550.0" y="540.5" text-anchor="middle">可查看保存结果</text><rect x="795" y="70" width="280" height="110" rx="14" fill="#f2eeff" stroke="#c6b8ef"/><text x="935.0" y="105.0" text-anchor="middle">服务端结果不确定</text><text x="935.0" y="132.0" text-anchor="middle">保留原请求与未确定占用</text><text x="935.0" y="159.0" text-anchor="middle">查明后只结算一次</text><polyline points="550,140 550,195" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><polyline points="380,231 305,231" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="324" y="217" font-size="17" fill="#61687c">失败</text><polyline points="550,267 550,330" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="304" font-size="17" fill="#61687c">成功</text><polyline points="720,373 795,373" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="723" y="355" font-size="17" fill="#61687c">明确失败</text><polyline points="550,415 550,475" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="450" font-size="17" fill="#61687c">成功</text><polyline points="720,110 795,110" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="96" font-size="17" fill="#61687c">无法确认</text><polyline points="720,350 755,350 755,150 795,150" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="291" font-size="17" fill="#61687c">提交结果不确定</text><line x1="40" y1="610" x2="1060" y2="610" stroke="#dce0e9"/><text x="40" y="654" font-size="21" font-weight="600">独立的页面恢复路径</text><rect x="40" y="690" width="270" height="80" rx="14" fill="#fff7e9" stroke="#e8d2a8"/><text x="175.0" y="723.5" text-anchor="middle">页面未收到结果</text><text x="175.0" y="750.5" text-anchor="middle">显示结果待确认</text><rect x="415" y="690" width="270" height="80" rx="14" fill="#f2eeff" stroke="#c6b8ef"/><text x="550.0" y="723.5" text-anchor="middle">查询原请求</text><text x="550.0" y="750.5" text-anchor="middle">不生成、不扣费</text><rect x="790" y="690" width="270" height="80" rx="14" fill="#f7f8fb" stroke="#dce0e9"/><text x="925.0" y="723.5" text-anchor="middle">展示真实状态</text><text x="925.0" y="750.5" text-anchor="middle">或保留待确认</text><polyline points="310,730 415,730" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><polyline points="685,730 790,730" fill="none" stroke="#8b91a3" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="825" font-size="17" fill="#61687c">服务端可能已经成功，而页面仍待确认。查询只恢复认知，不重复结算。</text></g></svg>