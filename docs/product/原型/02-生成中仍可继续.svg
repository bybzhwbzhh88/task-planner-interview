<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><title>02 生成中仍可继续</title><desc>额度处理产品原型，次数与时间为方案示例。</desc><defs><marker id="箭头" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91A2B5"/></marker></defs><rect width="1280" height="960" fill="#FFFFFF"/><g id="02_导航" ><text x="48" y="46" font-size="22" fill="#002142" font-weight="600" text-anchor="start">任务规划</text><line x1="164" y1="27" x2="164" y2="50" stroke="#DDE4EB" stroke-width="1"/><text x="184" y="44" font-size="15" fill="#667587" font-weight="400" text-anchor="start">日程生成</text><text x="1232" y="44" font-size="14" fill="#667587" font-weight="400" text-anchor="end">示例账号</text><line x1="0" y1="76" x2="1280" y2="76" stroke="#DDE4EB" stroke-width="1"/></g><text x="48" y="123" font-size="29" fill="#002142" font-weight="600" text-anchor="start">安排你的日程</text><text x="48" y="151" font-size="14" fill="#667587" font-weight="400" text-anchor="start">写下待办，选择时长，再生成一份可执行的安排。</text><g id="02_次数概览" ><rect x="48" y="176" width="1184" height="100" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="72" y="206" font-size="13" fill="#667587" font-weight="500" text-anchor="start">当前可用</text><text x="72" y="252" font-size="34" fill="#002142" font-weight="600" text-anchor="start">1 次</text><text x="230" y="220" font-size="16" fill="#243447" font-weight="500" text-anchor="start">剩余 2 次</text><text x="230" y="247" font-size="13" fill="#667587" font-weight="400" text-anchor="start">生成中占用 1 次</text><line x1="478" y1="197" x2="478" y2="255" stroke="#DDE4EB" stroke-width="1"/><text x="504" y="215" font-size="17" fill="#002142" font-weight="600" text-anchor="start">还可以生成另一份</text><text x="504" y="244" font-size="14" fill="#667587" font-weight="400" text-anchor="start">已有 1 份正在生成，仍有可用次数。</text></g><g id="02_待办输入与生成" ><rect x="48" y="300" width="452" height="512" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="72" y="337" font-size="19" fill="#002142" font-weight="600" text-anchor="start">待办与可用时长</text><text x="72" y="369" font-size="13" fill="#667587" font-weight="500" text-anchor="start">待办事项</text><rect x="72" y="384" width="404" height="36" rx="5" fill="#FFFFFF" stroke="#DDE4EB"/><rect x="85" y="395" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5DF"/><text x="111" y="408" font-size="14" fill="#243447" font-weight="400" text-anchor="start">阅读项目需求</text><text x="457" y="408" font-size="18" fill="#667587" font-weight="400" text-anchor="end">×</text><rect x="72" y="430" width="404" height="36" rx="5" fill="#FFFFFF" stroke="#DDE4EB"/><rect x="85" y="441" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5DF"/><text x="111" y="454" font-size="14" fill="#243447" font-weight="400" text-anchor="start">整理额度处理方案</text><text x="457" y="454" font-size="18" fill="#667587" font-weight="400" text-anchor="end">×</text><rect x="72" y="476" width="404" height="36" rx="5" fill="#FFFFFF" stroke="#DDE4EB"/><rect x="85" y="487" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5DF"/><text x="111" y="500" font-size="14" fill="#243447" font-weight="400" text-anchor="start">梳理页面流程</text><text x="457" y="500" font-size="18" fill="#667587" font-weight="400" text-anchor="end">×</text><text x="72" y="548" font-size="13" fill="#667587" font-weight="500" text-anchor="start">可用时长</text><rect x="72" y="563" width="404" height="43" rx="5" fill="#FFFFFF" stroke="#DDE4EB"/><text x="88" y="591" font-size="15" fill="#243447" font-weight="400" text-anchor="start">4 小时</text><text x="458" y="591" font-size="17" fill="#667587" font-weight="400" text-anchor="end">⌄</text><text x="72" y="636" font-size="13" fill="#667587" font-weight="400" text-anchor="start">每成功生成一份日程，使用 1 次。</text><text x="72" y="657" font-size="13" fill="#667587" font-weight="400" text-anchor="start">生成中暂时占用，明确失败会解除占用。</text><g id="02_前往03_生成另一份日程" data-target="03" role="button" tabindex="0" style="cursor:pointer"><rect x="72" y="681" width="404" height="44" rx="6" fill="#002142" stroke="#002142"/><text x="274" y="709" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="middle">生成另一份日程</text></g><text x="72" y="751" font-size="13" fill="#667587" font-weight="400" text-anchor="start">编辑仅影响下一次提交，不改变生成 1。</text></g><g id="02_独立请求处理进度" ><rect x="524" y="300" width="708" height="196" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="548" y="337" font-size="19" fill="#002142" font-weight="600" text-anchor="start">生成进度</text><text x="548" y="373" font-size="14" fill="#243447" font-weight="600" text-anchor="start">生成 1</text><text x="620" y="373" font-size="13" fill="#667587" font-weight="400" text-anchor="start">· 6 小时</text><text x="548" y="397" font-size="12" fill="#667587" font-weight="400" text-anchor="start">暂占 1 次，成功后才扣次</text><rect x="1116" y="360" width="68" height="25" rx="4" fill="#F7F9FB" stroke="#F7F9FB"/><text x="1126" y="377" font-size="12" fill="#002142" font-weight="500" text-anchor="start">正在生成</text></g><g id="02_最近一次成功日程" ><rect x="524" y="516" width="708" height="296" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="548" y="553" font-size="19" fill="#002142" font-weight="600" text-anchor="start">最近一次成功日程</text><text x="548" y="581" font-size="12" fill="#667587" font-weight="400" text-anchor="start">上次保存 · 可用 6 小时 · 10:00 保存</text><rect x="548" y="601" width="660" height="52" rx="5" fill="#F7F9FB" stroke="#F7F9FB"/><text x="562" y="632" font-size="12" fill="#667587" font-weight="400" text-anchor="start">09:00—11:00</text><text x="706" y="632" font-size="14" fill="#243447" font-weight="500" text-anchor="start">阅读项目需求</text><text x="1189" y="632" font-size="13" fill="#667587" font-weight="400" text-anchor="end">2 小时</text><rect x="548" y="664" width="660" height="52" rx="5" fill="#F7F9FB" stroke="#F7F9FB"/><text x="562" y="695" font-size="12" fill="#667587" font-weight="400" text-anchor="start">11:00—13:00</text><text x="706" y="695" font-size="14" fill="#243447" font-weight="500" text-anchor="start">整理额度处理方案</text><text x="1189" y="695" font-size="13" fill="#667587" font-weight="400" text-anchor="end">2 小时</text><rect x="548" y="727" width="660" height="52" rx="5" fill="#F7F9FB" stroke="#F7F9FB"/><text x="562" y="758" font-size="12" fill="#667587" font-weight="400" text-anchor="start">14:00—16:00</text><text x="706" y="758" font-size="14" fill="#243447" font-weight="500" text-anchor="start">梳理页面流程</text><text x="1189" y="758" font-size="13" fill="#667587" font-weight="400" text-anchor="end">2 小时</text></g><g id="02_原型演示导航_非产品界面" ><line x1="48" y1="837" x2="1232" y2="837" stroke="#DDE4EB" stroke-width="1"/><text x="48" y="864" font-size="13" fill="#002142" font-weight="600" text-anchor="start">原型演示</text><text x="126" y="864" font-size="12" fill="#667587" font-weight="400" text-anchor="start">下方用于切换场景，不属于产品界面。</text><text x="1232" y="864" font-size="12" fill="#667587" font-weight="400" text-anchor="end">02 生成中仍可继续</text><g id="02_前往00_回到流程" data-target="00" role="button" tabindex="0" style="cursor:pointer"><rect x="48" y="881" width="110" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="103" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">回到流程</text></g><g id="02_前往07_结果待确认" data-target="07" role="button" tabindex="0" style="cursor:pointer"><rect x="168" y="881" width="132" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="234" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">结果待确认</text></g><g id="02_前往08_刷新恢复" data-target="08" role="button" tabindex="0" style="cursor:pointer"><rect x="310" y="881" width="116" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="368" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">刷新恢复</text></g><g id="02_前往09_日程读取失败" data-target="09" role="button" tabindex="0" style="cursor:pointer"><rect x="436" y="881" width="132" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="502" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">日程读取失败</text></g><g id="02_前往10_尚无日程" data-target="10" role="button" tabindex="0" style="cursor:pointer"><rect x="578" y="881" width="116" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="636" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">尚无日程</text></g><g id="02_前往11_次数状态待确认" data-target="11" role="button" tabindex="0" style="cursor:pointer"><rect x="704" y="881" width="144" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="776" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">次数状态待确认</text></g><text x="48" y="941" font-size="11" fill="#667587" font-weight="400" text-anchor="start">次数、待办、时长与时间均为方案示例；01—06 为连续主线。设计演示不代表程序已经实现。</text></g></svg>