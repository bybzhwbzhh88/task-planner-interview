<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><title>00 生成流程</title><desc>额度处理产品原型，次数与时间为方案示例。</desc><defs><marker id="箭头" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91A2B5"/></marker></defs><rect width="1280" height="960" fill="#FFFFFF"/><g id="00_导航" ><text x="48" y="46" font-size="22" fill="#002142" font-weight="600" text-anchor="start">任务规划</text><line x1="164" y1="27" x2="164" y2="50" stroke="#DDE4EB" stroke-width="1"/><text x="184" y="44" font-size="15" fill="#667587" font-weight="400" text-anchor="start">日程生成</text><text x="1232" y="44" font-size="14" fill="#667587" font-weight="400" text-anchor="end">示例账号</text><line x1="0" y1="76" x2="1280" y2="76" stroke="#DDE4EB" stroke-width="1"/></g><text x="48" y="123" font-size="29" fill="#002142" font-weight="600" text-anchor="start">先取得可用次数，再开始生成</text><text x="48" y="154" font-size="14" fill="#667587" font-weight="400" text-anchor="start">每份请求单独预留、单独反馈；成功才扣次，明确失败释放占用。</text><g id="00_流程连接" ><polyline points="288,258 330,258" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 330 258 L 322 262 L 322 254 Z" fill="#91A2B5"/><polyline points="620,258 664,258" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 664 258 L 656 262 L 656 254 Z" fill="#91A2B5"/><polyline points="914,258 958,258" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 958 258 L 950 262 L 950 254 Z" fill="#91A2B5"/><polyline points="480,318 480,355 236,355 236,388" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 236 388 L 232 380 L 240 380 Z" fill="#91A2B5"/><polyline points="1100,318 1100,344 640,344 640,388" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 640 388 L 636 380 L 644 380 Z" fill="#91A2B5"/><polyline points="1100,318 1100,388" fill="none" stroke="#91A2B5" stroke-width="1.5"/><path d="M 1100 388 L 1096 380 L 1104 380 Z" fill="#91A2B5"/></g><g id="00_填写待办与时长" ><rect x="48" y="202" width="240" height="116" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="70" y="236" font-size="18" fill="#002142" font-weight="600" text-anchor="start">填写待办与时长</text><text x="70" y="265" font-size="14" fill="#667587" font-weight="400" text-anchor="start">一次提交对应一份日程，</text><text x="70" y="287" font-size="14" fill="#667587" font-weight="400" text-anchor="start">不按待办条数计次。</text></g><g id="00_后台检查与预留" ><rect x="340" y="202" width="280" height="116" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="362" y="236" font-size="18" fill="#002142" font-weight="600" text-anchor="start">检查并预留</text><text x="362" y="265" font-size="14" fill="#667587" font-weight="400" text-anchor="start">后台整体检查最新可用次数，</text><text x="362" y="287" font-size="14" fill="#667587" font-weight="400" text-anchor="start">先预留 1 次，再调用模型。</text></g><g id="00_生成处理中" ><rect x="674" y="202" width="240" height="116" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="696" y="236" font-size="18" fill="#002142" font-weight="600" text-anchor="start">生成处理中</text><text x="696" y="265" font-size="14" fill="#667587" font-weight="400" text-anchor="start">仍有空余次数时，</text><text x="696" y="287" font-size="14" fill="#667587" font-weight="400" text-anchor="start">可以提交另一份日程。</text></g><g id="00_确认生成结果" ><rect x="968" y="202" width="264" height="116" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="990" y="236" font-size="18" fill="#002142" font-weight="600" text-anchor="start">确认处理结果</text><text x="990" y="265" font-size="14" fill="#667587" font-weight="400" text-anchor="start">保存与扣次一起确认；</text><text x="990" y="287" font-size="14" fill="#667587" font-weight="400" text-anchor="start">每份请求只结算一次。</text></g><g id="00_拒绝新增请求" ><rect x="48" y="390" width="376" height="194" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="70" y="424" font-size="18" fill="#002142" font-weight="600" text-anchor="start">没有可用次数</text><text x="70" y="453" font-size="14" fill="#667587" font-weight="400" text-anchor="start">区分次数用完与正在被占用。</text><text x="70" y="475" font-size="14" fill="#667587" font-weight="400" text-anchor="start">拒绝新增，不调用模型、不扣次，</text><text x="70" y="497" font-size="14" fill="#667587" font-weight="400" text-anchor="start">已经接收的请求继续执行。</text></g><g id="00_前往03_查看占用状态" data-target="03" role="button" tabindex="0" style="cursor:pointer"><rect x="70" y="534" width="150" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="145" y="555" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看占用状态</text></g><g id="00_前往06_查看次数用完" data-target="06" role="button" tabindex="0" style="cursor:pointer"><rect x="230" y="534" width="150" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="305" y="555" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看次数用完</text></g><g id="00_成功扣次与展示" ><rect x="452" y="390" width="376" height="194" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="474" y="424" font-size="18" fill="#002142" font-weight="600" text-anchor="start">成功：使用 1 次</text><text x="474" y="453" font-size="14" fill="#667587" font-weight="400" text-anchor="start">日程保存、扣次与解除占用一起完成。</text><text x="474" y="475" font-size="14" fill="#667587" font-weight="400" text-anchor="start">占用转为消耗，不额外腾出次数。</text><text x="474" y="497" font-size="14" fill="#667587" font-weight="400" text-anchor="start">按保存确认顺序展示最近成功日程。</text></g><g id="00_前往04_查看成功页面" data-target="04" role="button" tabindex="0" style="cursor:pointer"><rect x="474" y="534" width="160" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="554" y="555" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看成功页面</text></g><g id="00_明确失败释放占用" ><rect x="856" y="390" width="376" height="194" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="878" y="424" font-size="18" fill="#002142" font-weight="600" text-anchor="start">明确失败：不扣次</text><text x="878" y="453" font-size="14" fill="#667587" font-weight="400" text-anchor="start">只解除本请求占用，可修改后再试。</text><text x="878" y="475" font-size="14" fill="#667587" font-weight="400" text-anchor="start">保留已有成功日程，</text><text x="878" y="497" font-size="14" fill="#667587" font-weight="400" text-anchor="start">不影响其他请求继续处理。</text></g><g id="00_前往05_查看失败页面" data-target="05" role="button" tabindex="0" style="cursor:pointer"><rect x="878" y="534" width="160" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="958" y="555" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看失败页面</text></g><text x="48" y="631" font-size="20" fill="#002142" font-weight="600" text-anchor="start">遇到异常时，先读状态，再决定下一步</text><g id="00_异常分支_结果待确认" ><rect x="48" y="654" width="376" height="124" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="70" y="688" font-size="18" fill="#002142" font-weight="600" text-anchor="start">结果待确认</text><text x="70" y="717" font-size="14" fill="#667587" font-weight="400" text-anchor="start">超时不等于失败，先查询本请求。</text></g><g id="00_前往07_查看页面" data-target="07" role="button" tabindex="0" style="cursor:pointer"><rect x="70" y="734" width="150" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="145" y="755" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看页面</text></g><g id="00_异常分支_刷新后恢复" ><rect x="452" y="654" width="376" height="124" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="474" y="688" font-size="18" fill="#002142" font-weight="600" text-anchor="start">刷新后恢复</text><text x="474" y="717" font-size="14" fill="#667587" font-weight="400" text-anchor="start">只读取最近结果、次数与处理进度。</text></g><g id="00_前往08_查看页面" data-target="08" role="button" tabindex="0" style="cursor:pointer"><rect x="474" y="734" width="150" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="549" y="755" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看页面</text></g><g id="00_异常分支_日程读取失败" ><rect x="856" y="654" width="376" height="124" rx="8" fill="#FFFFFF" stroke="#DDE4EB"/><text x="878" y="688" font-size="18" fill="#002142" font-weight="600" text-anchor="start">日程读取失败</text><text x="878" y="717" font-size="14" fill="#667587" font-weight="400" text-anchor="start">重读对应数据，不自动重新生成。</text></g><g id="00_前往09_查看页面" data-target="09" role="button" tabindex="0" style="cursor:pointer"><rect x="878" y="734" width="150" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="953" y="755" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">查看页面</text></g><g id="00_前往01_从主线开始" data-target="01" role="button" tabindex="0" style="cursor:pointer"><rect x="1062" y="110" width="170" height="44" rx="6" fill="#002142" stroke="#002142"/><text x="1147" y="138" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="middle">从主线开始</text></g><g id="00_原型演示导航_非产品界面" ><line x1="48" y1="837" x2="1232" y2="837" stroke="#DDE4EB" stroke-width="1"/><text x="48" y="864" font-size="13" fill="#002142" font-weight="600" text-anchor="start">原型演示</text><text x="126" y="864" font-size="12" fill="#667587" font-weight="400" text-anchor="start">下方用于切换场景，不属于产品界面。</text><text x="1232" y="864" font-size="12" fill="#667587" font-weight="400" text-anchor="end">00 生成流程</text><g id="00_前往00_回到流程" data-target="00" role="button" tabindex="0" style="cursor:pointer"><rect x="48" y="881" width="110" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="103" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">回到流程</text></g><g id="00_前往07_结果待确认" data-target="07" role="button" tabindex="0" style="cursor:pointer"><rect x="168" y="881" width="132" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="234" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">结果待确认</text></g><g id="00_前往08_刷新恢复" data-target="08" role="button" tabindex="0" style="cursor:pointer"><rect x="310" y="881" width="116" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="368" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">刷新恢复</text></g><g id="00_前往09_日程读取失败" data-target="09" role="button" tabindex="0" style="cursor:pointer"><rect x="436" y="881" width="132" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="502" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">日程读取失败</text></g><g id="00_前往10_尚无日程" data-target="10" role="button" tabindex="0" style="cursor:pointer"><rect x="578" y="881" width="116" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="636" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">尚无日程</text></g><g id="00_前往11_次数状态待确认" data-target="11" role="button" tabindex="0" style="cursor:pointer"><rect x="704" y="881" width="144" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="776" y="902" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">次数状态待确认</text></g><text x="48" y="941" font-size="11" fill="#667587" font-weight="400" text-anchor="start">次数、待办、时长与时间均为方案示例；01—06 为连续主线。设计演示不代表程序已经实现。</text></g></svg>