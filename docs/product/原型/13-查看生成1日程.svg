<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><title>13 查看生成1日程</title><desc>额度处理产品原型，次数与时间为方案示例。</desc><defs><marker id="箭头" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91A2B5"/></marker></defs><rect width="720" height="560" fill="#FFFFFF"/><g id="13_查看本请求日程弹层" ><text x="32" y="60" font-size="24" fill="#002142" font-weight="600" text-anchor="start">生成 1的日程</text><text x="32" y="95" font-size="14" fill="#667587" font-weight="400" text-anchor="start">10:05 保存 · 可用 6 小时</text><line x1="32" y1="119" x2="688" y2="119" stroke="#DDE4EB" stroke-width="1"/><g id="13_关闭日程" data-action="close" role="button" tabindex="0" style="cursor:pointer"><rect x="632" y="26" width="56" height="32" rx="6" fill="#002142" stroke="#002142"/><text x="660" y="47" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">关闭</text></g><rect x="32" y="144" width="656" height="68" rx="6" fill="#F7F9FB" stroke="#F7F9FB"/><text x="48" y="184" font-size="13" fill="#667587" font-weight="400" text-anchor="start">09:00—11:00</text><text x="210" y="184" font-size="16" fill="#243447" font-weight="500" text-anchor="start">阅读项目需求</text><text x="671" y="184" font-size="14" fill="#667587" font-weight="400" text-anchor="end">2 小时</text><rect x="32" y="226" width="656" height="68" rx="6" fill="#F7F9FB" stroke="#F7F9FB"/><text x="48" y="266" font-size="13" fill="#667587" font-weight="400" text-anchor="start">11:00—13:00</text><text x="210" y="266" font-size="16" fill="#243447" font-weight="500" text-anchor="start">整理额度处理方案</text><text x="671" y="266" font-size="14" fill="#667587" font-weight="400" text-anchor="end">2 小时</text><rect x="32" y="308" width="656" height="68" rx="6" fill="#F7F9FB" stroke="#F7F9FB"/><text x="48" y="348" font-size="13" fill="#667587" font-weight="400" text-anchor="start">14:00—16:00</text><text x="210" y="348" font-size="16" fill="#243447" font-weight="500" text-anchor="start">梳理页面流程</text><text x="671" y="348" font-size="14" fill="#667587" font-weight="400" text-anchor="end">2 小时</text><text x="32" y="429" font-size="14" fill="#667587" font-weight="400" text-anchor="start">仅查看已保存结果，不消耗次数。</text><g id="13_返回任务页" data-action="close" role="button" tabindex="0" style="cursor:pointer"><rect x="264" y="472" width="192" height="44" rx="6" fill="#002142" stroke="#002142"/><text x="360" y="500" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="middle">返回任务页</text></g></g></svg>