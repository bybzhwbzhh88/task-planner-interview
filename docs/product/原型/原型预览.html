const picker=document.getElementById('page'),overlay=document.getElementById('overlay'),stage=document.querySelector('.stage'),viewer=document.querySelector('.viewer');let returnFocus=null;
function closeOverlay(restore=true){overlay.hidden=true;document.querySelectorAll('[data-overlay]').forEach(x=>x.hidden=true);stage.inert=false;viewer.inert=false;if(restore&&returnFocus&&returnFocus.isConnected)returnFocus.focus();returnFocus=null;}
function openOverlay(id,trigger){const screen=document.querySelector('[data-overlay="'+id+'"]');if(!screen)return;returnFocus=trigger||document.activeElement;document.querySelectorAll('[data-overlay]').forEach(x=>x.hidden=x!==screen);overlay.setAttribute('aria-label',screen.getAttribute('aria-label'));overlay.hidden=false;stage.inert=true;viewer.inert=true;screen.querySelector('[data-action="close"]').focus();}
function show(id){closeOverlay(false);if(!document.querySelector('[data-page="'+id+'"]'))id='00';document.querySelectorAll('[data-page]').forEach(x=>x.hidden=x.dataset.page!==id);picker.value=id;history.replaceState(null,'','#'+id);document.title=picker.selectedOptions[0].textContent+'｜额度处理原型';}
function activate(x){if(x.dataset.action==='close')closeOverlay();else if(x.dataset.action==='overlay')openOverlay(x.dataset.target,x);else if(x.dataset.target)show(x.dataset.target);}
document.addEventListener('click',e=>{const x=e.target.closest('[data-target],[data-action]');if(x)activate(x);else if(e.target===overlay)closeOverlay();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden){e.preventDefault();closeOverlay();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-target],[data-action]')){e.preventDefault();activate(e.target);}if(e.key==='Tab'&&!overlay.hidden){const buttons=[...overlay.querySelector('.overlay-screen:not([hidden])').querySelectorAll('[role="button"]')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
picker.addEventListener('change',()=>show(picker.value));window.addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1)||'00');
</script></body></html>
